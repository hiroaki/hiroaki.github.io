<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Pan Direction Tracker — Street View Demo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css"
  >

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #222;
    }

    header {
      padding: 14px 18px;
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    header p {
      margin: 0;
      color: #555;
      font-size: 14px;
      line-height: 1.45;
    }

    #map {
      flex: 1;
      min-height: 0;
    }

    .street-view-popup {
      min-width: 120px;
      width: 200px;
    }

    .street-view-popup h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .street-view-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 12px 12px 12px;
    }

    .heading-compass {
      position: relative;
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      border: 1px solid #999;
      border-radius: 50%;
      background: #fff;
    }

    .heading-compass::before {
      content: "N";
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
      font:
        10px/1 ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
      color: #666;
    }

    .heading-arrow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 22px;
      background: #222;
      transform-origin: 50% 100%;
      transform:
        translate(-50%, -100%)
        rotate(0deg);
    }

    .heading-arrow::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-top: 2px solid #222;
      border-right: 2px solid #222;
      transform:
        translateX(-50%)
        rotate(-45deg);
      transform-origin: center;
    }

    .heading-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #222;
      transform: translate(-50%, -50%);
    }

    .heading-value {
      font:
        13px/1.5 ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
      white-space: pre;
    }

    .street-view-location {
      margin: 0 0 10px;
      font:
        11px/1.5 ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
      color: #666;
    }

    .street-view-link {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #777;
      border-radius: 4px;
      background: #f7f7f7;
      color: #111;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }

    .street-view-link:hover {
      background: #eee;
    }

    .street-view-note {
      margin: 8px 0 0;
      color: #666;
      font-size: 11px;
      line-height: 1.4;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.js"
      }
    }
  </script>
</head>

<body>
  <header>
    <h1>Pan Direction Tracker — Street View Demo</h1>
    <p>
      Pan the map in the direction you want to explore, then click a
      location to open its Street View link. After selecting a location,
      you can pan again to change only the viewing direction.
    </p>
  </header>

  <div id="map"></div>

  <script type="module">
    import {
      Map,
      TileLayer,
      Popup,
    } from "leaflet";

    import {
      PanDirectionTracker,
    } from "../src/panDirectionTracker.js";

    const map = new Map("map").setView(
      [35.6812, 139.7671],
      15,
    );

    new TileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          "OpenStreetMap contributors</a>",
      },
    ).addTo(map);

    const tracker = new PanDirectionTracker(map);
    tracker.enable();

    let selectedLocation = null;
    let popup = null;

    map.on("click", (event) => {
      selectLocation(event.latlng);
    });

    /*
     * PanDirectionTracker registered its dragend listener in enable()
     * before this listener is registered. The tracker therefore finishes
     * the gesture first, and this handler reads the updated heading.
     */
    map.on("dragend", () => {
      if (selectedLocation === null) {
        return;
      }

      updatePopup();
    });

    function selectLocation(latlng) {
      selectedLocation = {
        lat: latlng.lat,
        lng: latlng.lng,
      };

      if (popup === null) {
        popup = new Popup({
          closeOnClick: false,
          autoClose: false,
          closeButton: true,
          autoPan: false,
        });
      }

      popup
        .setLatLng(selectedLocation)
        .setContent(createPopupContent())
        .openOn(map);
    }

    function updatePopup() {
      if (
        selectedLocation === null ||
        popup === null
      ) {
        return;
      }

      /*
       * setContent() is intentionally used rather than closing and
       * reopening the popup. The selected Street View location remains
       * fixed while only its heading changes.
       */
      popup.setContent(createPopupContent());
    }

    function createPopupContent() {
      const heading = tracker.getLastHeading();

      const root = document.createElement("div");
      root.className = "street-view-popup";

      const title = document.createElement("h2");
      title.textContent = "Street View";
      root.append(title);

      const location = document.createElement("div");
      location.className = "street-view-location";
      location.textContent =
        `${selectedLocation.lat.toFixed(6)}, ` +
        `${selectedLocation.lng.toFixed(6)}`;
      root.append(location);

      const headingRow = document.createElement("div");
      headingRow.className = "street-view-heading";

      const compass = document.createElement("div");
      compass.className = "heading-compass";

      const center = document.createElement("div");
      center.className = "heading-center";
      compass.append(center);

      if (heading !== null) {
        const arrow = document.createElement("div");
        arrow.className = "heading-arrow";
        arrow.style.transform =
          `translate(-50%, -100%) rotate(${heading}deg)`;
        compass.append(arrow);
      }

      headingRow.append(compass);

      const headingValue = document.createElement("div");
      headingValue.className = "heading-value";

      if (heading === null) {
        headingValue.textContent =
          "Heading\n—";
      } else {
        headingValue.textContent =
          "Heading\n" +
          `${heading.toFixed(1)}° ` +
          headingToCompass(heading);
      }

      headingRow.append(headingValue);
      root.append(headingRow);

      const link = document.createElement("a");
      link.className = "street-view-link";
      link.href = createStreetViewUrl(
        selectedLocation,
        heading,
      );
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open Street View";
      root.append(link);

      const note = document.createElement("p");
      note.className = "street-view-note";

      if (heading === null) {
        note.textContent =
          "No pan direction has been recorded yet. " +
          "Google Maps will choose the initial viewing direction.";
      } else {
        note.textContent =
          "Pan the map again to update the viewing direction " +
          "without changing this location.";
      }

      root.append(note);

      return root;
    }

    function createStreetViewUrl(location, heading) {
      const url = new URL(
        "https://www.google.com/maps/@",
      );

      url.searchParams.set("api", "1");
      url.searchParams.set("map_action", "pano");
      url.searchParams.set(
        "viewpoint",
        `${location.lat},${location.lng}`,
      );

      if (heading !== null) {
        url.searchParams.set(
          "heading",
          heading.toFixed(1),
        );
      }

      return url.toString();
    }

    function headingToCompass(heading) {
      const directions = [
        "N",
        "NE",
        "E",
        "SE",
        "S",
        "SW",
        "W",
        "NW",
      ];

      const index =
        Math.round(heading / 45) %
        directions.length;

      return directions[index];
    }
  </script>
</body>
</html>
